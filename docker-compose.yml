services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: landguard
      POSTGRES_PASSWORD: landguard
      POSTGRES_DB: landguard
    ports:
      - "5432:5432"
    volumes:
      - landguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landguard -d landguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - landguard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://landguard:landguard@postgres:5432/landguard?schema=public
      REDIS_URL: redis://redis:6379
      OTP_TTL_SECONDS: 300
      VETO_WINDOW_HOURS: 24
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  landguard-postgres:
  landguard-redis:
